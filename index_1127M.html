<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小六年級數學：第6單元 扇形的周長和面積 後測線上測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.9em;
            line-height: 1.1;
            margin: 0 3px;
        }
        .fraction .num {
            border-bottom: 1.5px solid currentColor;
            padding: 0 3px 1px 3px;
        }
        .fraction .den {
            padding: 1px 3px 0 3px;
        }
        #scratchpadCanvas {
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-gradient-to-r from-indigo-700 via-blue-700 to-sky-700 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                    <svg class="w-7 h-7 text-amber-300" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c2.76 0 5.26-1.12 7.07-2.93L12 12V2z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-wide">國小六年級數學 • 第6單元 後測線上測驗</h1>
                    <p class="text-xs text-sky-100">扇形的周長和面積（共 12 題，滿分 100 分，圓周率以 3.14 計算）</p>
                </div>
            </div>

            <button onclick="restartQuiz()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-4 py-2 rounded-xl text-sm shadow-sm flex items-center gap-1.5 transition active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span>重新測驗（隨機換題）</span>
            </button>
        </div>
    </header>

    <!-- 主要測驗區 -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- 左側題目區 (8 欄) -->
        <div class="lg:col-span-8 flex flex-col gap-5">

            <!-- 題號導覽與交卷列 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col gap-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5">
                        <span id="qNumberBadge" class="bg-indigo-600 text-white text-sm font-bold px-3.5 py-1 rounded-xl">
                            第 1 / 12 題
                        </span>
                        <span id="qPointsBadge" class="bg-amber-100 text-amber-900 text-xs font-bold px-2.5 py-1 rounded-lg border border-amber-300">
                            本題 8 分
                        </span>
                        <span id="qTypeTag" class="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg border border-slate-200">
                            一、比值觀念
                        </span>
                    </div>

                    <div class="flex items-center gap-3">
                        <span id="answeredProgress" class="text-xs font-bold text-slate-500">已作答：0 / 12 題</span>
                        <button id="btnSubmitQuiz" onclick="openSubmitConfirm()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-1.5 rounded-xl text-sm shadow transition active:scale-95">
                            交卷看成績
                        </button>
                    </div>
                </div>

                <!-- 1~12 題快速切換按鈕 -->
                <div id="questionNavDots" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-12 gap-1.5 pt-2 border-t border-slate-100">
                    <!-- 動態生成 -->
                </div>
            </div>

            <!-- 交卷確認橫幅 -->
            <div id="submitConfirmBar" class="hidden bg-amber-50 border-2 border-amber-400 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-sm">
                <div class="text-sm font-bold text-amber-900" id="submitConfirmText">
                    確定要交卷嗎？交卷後將立即計算總分。
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="closeSubmitConfirm()" class="px-3.5 py-1.5 rounded-xl bg-white border border-slate-300 text-slate-700 text-sm font-bold hover:bg-slate-50">
                        繼續作答
                    </button>
                    <button onclick="finalizeQuiz()" class="px-4 py-1.5 rounded-xl bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700 shadow-sm">
                        確定交卷
                    </button>
                </div>
            </div>

            <!-- 成績單總覽卡片 (交卷後顯示) -->
            <div id="scoreSummaryCard" class="hidden bg-white rounded-2xl p-6 shadow-md border-2 border-indigo-600 flex flex-col gap-5">
                <div class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl p-5 flex flex-wrap items-center justify-between gap-4">
                    <div>
                        <div class="text-xs uppercase tracking-wider text-indigo-100 font-bold">第6單元後測評量成績單</div>
                        <div class="text-3xl sm:text-4xl font-black mt-1 flex items-baseline gap-2">
                            總分：<span id="totalScoreText" class="text-5xl text-amber-300">0</span> 分 <span class="text-base font-normal text-indigo-100">/ 滿分 100 分</span>
                        </div>
                        <p id="scoreSummarySub" class="text-sm text-indigo-50 mt-1">答對 0 題 / 共 12 題</p>
                    </div>
                    <button onclick="restartQuiz()" class="bg-white text-indigo-800 hover:bg-indigo-50 font-bold px-5 py-3 rounded-xl shadow transition">
                        重新測驗（隨機換題）
                    </button>
                </div>

                <!-- 12 題對錯結果列表 -->
                <div class="overflow-x-auto">
                    <table class="w-full text-sm border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                                <th class="py-2.5 px-3 text-center">題號</th>
                                <th class="py-2.5 px-3 text-center">配分</th>
                                <th class="py-2.5 px-3 text-left">題型項目</th>
                                <th class="py-2.5 px-3 text-center">你的答案</th>
                                <th class="py-2.5 px-3 text-center">正確答案</th>
                                <th class="py-2.5 px-3 text-center">得分</th>
                            </tr>
                        </thead>
                        <tbody id="scoreTableBody" class="divide-y divide-slate-100">
                            <!-- 動態生成 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 題目作答主卡片 -->
            <div id="questionMainCard" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 flex flex-col gap-6">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                    <!-- 動態 SVG 幾何圖形 -->
                    <div class="md:col-span-5 bg-slate-50 border border-slate-200/90 rounded-2xl p-4 flex flex-col items-center justify-center min-h-[245px]">
                        <div id="svgContainer" class="w-full max-w-[235px] aspect-square flex items-center justify-center">
                            <!-- 動態插入 SVG -->
                        </div>
                    </div>

                    <!-- 題目敘述與作答控制 -->
                    <div class="md:col-span-7 flex flex-col justify-between gap-5">
                        <div id="questionPrompt" class="text-lg sm:text-xl font-bold text-slate-800 leading-relaxed">
                            <!-- 題目文字 -->
                        </div>

                        <!-- 分數輸入區 (第 1~3 題比值題使用) -->
                        <div id="fractionInputContainer" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-4">
                            <label class="block text-sm font-bold text-slate-700 mb-2">請輸入最簡分數比值：</label>
                            <div class="inline-flex flex-col items-center bg-white border-2 border-slate-300 rounded-xl px-4 py-2.5">
                                <input type="number" id="fracNumInput" placeholder="分子"
                                    oninput="handleFractionInput()"
                                    class="w-24 text-center text-lg font-bold text-slate-800 border-b-2 border-slate-700 pb-1 focus:outline-none focus:border-indigo-600">
                                <input type="number" id="fracDenInput" placeholder="分母"
                                    oninput="handleFractionInput()"
                                    onkeydown="if(event.key==='Enter') goNextQuestion()"
                                    class="w-24 text-center text-lg font-bold text-slate-800 pt-1 focus:outline-none focus:border-indigo-600">
                            </div>
                        </div>

                        <!-- 單一數值輸入區 (第 4~12 題使用) -->
                        <div id="numericInputContainer" class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                            <label for="numericAnswerInput" class="block text-sm font-bold text-slate-700 mb-2">請輸入答案：</label>
                            <div class="flex items-center gap-3">
                                <div class="relative flex-grow max-w-[250px]">
                                    <input type="number" step="any" id="numericAnswerInput" placeholder="輸入數字"
                                        oninput="handleNumericInput(this.value)"
                                        onkeydown="if(event.key==='Enter') goNextQuestion()"
                                        class="w-full text-lg font-bold text-slate-800 bg-white border-2 border-slate-300 focus:border-indigo-600 focus:outline-none rounded-xl px-4 py-2.5 pr-20 transition">
                                    <span id="unitText" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 font-bold text-sm">cm</span>
                                </div>
                            </div>
                        </div>

                        <!-- 交卷後的單題對錯標示 -->
                        <div id="postSubmitResultBanner" class="hidden rounded-xl p-3.5 text-sm font-bold border">
                        </div>
                    </div>
                </div>

                <!-- 上一題 / 下一題導覽按鈕 -->
                <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                    <button id="btnPrev" onclick="goPrevQuestion()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition">
                        ← 上一題
                    </button>
                    <span class="text-xs text-slate-400">作答內容自動保存</span>
                    <button id="btnNext" onclick="goNextQuestion()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-sm transition">
                        下一題 →
                    </button>
                </div>
            </div>

        </div>

        <!-- 右側空白計算草稿紙 (4 欄) -->
        <div class="lg:col-span-4 flex flex-col">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col">
                <div class="bg-slate-100 px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                    <span class="text-sm font-bold text-slate-800">✏️ 計算草稿紙</span>
                    <div class="flex items-center gap-1.5">
                        <button onclick="setPen('#1e293b', 2.5)" class="w-5 h-5 rounded-full bg-slate-800 border-2 border-white shadow ring-1 ring-slate-300" title="黑筆"></button>
                        <button onclick="setPen('#0284c7', 2.5)" class="w-5 h-5 rounded-full bg-sky-600 border-2 border-white shadow" title="藍筆"></button>
                        <button onclick="setPen('#e11d48', 2.5)" class="w-5 h-5 rounded-full bg-rose-600 border-2 border-white shadow" title="紅筆"></button>
                        <button onclick="setEraser()" class="px-2 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold rounded-lg transition">
                            橡皮擦
                        </button>
                        <button onclick="clearPad()" class="px-2 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-lg transition">
                            清除
                        </button>
                    </div>
                </div>
                <div class="p-3 bg-[#fffdf7]">
                    <canvas id="scratchpadCanvas" class="w-full h-[380px] rounded-xl border border-slate-200 block"></canvas>
                </div>
            </div>
        </div>

    </main>

    <script>
        // =========================================================================
        // 1. 數學輔助工具
        // =========================================================================
        function cleanNum(n) {
            return Math.round(n * 10000) / 10000;
        }

        function pick(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) {
                const t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function polar(cx, cy, r, deg) {
            const rad = (-deg * Math.PI) / 180;
            return {
                x: cx + r * Math.cos(rad),
                y: cy + r * Math.sin(rad)
            };
        }

        // =========================================================================
        // 2. 動態 SVG 圖形繪製（嚴格對應附件「第6單元後測評量試題」）
        // =========================================================================

        // 第一大題 SVG：圓心角 deg° 扇形（與附件第一大題插圖一致）
        function svgPart1Sector(deg, rVal) {
            const cx = 110, cy = 114, r = 72;
            const p0 = polar(cx, cy, r, 0);
            const p1 = polar(cx, cy, r, deg);
            const largeArc = deg > 180 ? 1 : 0;
            const sector = `M ${cx} ${cy} L ${p0.x} ${p0.y} A ${r} ${r} 0 ${largeArc} 0 ${p1.x} ${p1.y} Z`;

            const ar = 20;
            const a0 = polar(cx, cy, ar, 0);
            const a1 = polar(cx, cy, ar, deg);
            const arcMark = deg === 90
                ? `<polyline points="${cx + 14},${cy} ${cx + 14},${cy - 14} ${cx},${cy - 14}" fill="none" stroke="#1e293b" stroke-width="1.5"/>`
                : `<path d="M ${a0.x} ${a0.y} A ${ar} ${ar} 0 ${largeArc} 0 ${a1.x} ${a1.y}" fill="none" stroke="#1e293b" stroke-width="1.5"/>`;

            const labelPos = polar(cx, cy, 38, deg / 2);

            return `
            <svg viewBox="0 0 220 220" class="w-full h-full">
                <circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>
                <path d="${sector}" fill="#bae6fd" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>
                ${arcMark}
                <circle cx="${cx}" cy="${cy}" r="3" fill="#0f172a"/>
                <text x="${labelPos.x}" y="${labelPos.y}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" fill="#0f172a">${deg}°</text>
                <text x="${cx + r / 2}" y="${cy + 16}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">${rVal}cm</text>
            </svg>`;
        }

        // 第二大題 (1) SVG：圓心角 deg° 扇形，標示半徑 r cm
        function svgPart2SingleSector(deg, rVal) {
            const cx = 110, cy = 128, r = 76;
            const p0 = polar(cx, cy, r, 0);
            const p1 = polar(cx, cy, r, deg);
            const largeArc = deg > 180 ? 1 : 0;
            const sector = `M ${cx} ${cy} L ${p0.x} ${p0.y} A ${r} ${r} 0 ${largeArc} 0 ${p1.x} ${p1.y} Z`;

            const ar = 20;
            const a0 = polar(cx, cy, ar, 0);
            const a1 = polar(cx, cy, ar, deg);
            const arcMark = deg === 90
                ? `<polyline points="${cx + 14},${cy} ${cx + 14},${cy - 14} ${cx},${cy - 14}" fill="none" stroke="#1e293b" stroke-width="1.5"/>`
                : `<path d="M ${a0.x} ${a0.y} A ${ar} ${ar} 0 ${largeArc} 0 ${a1.x} ${a1.y}" fill="none" stroke="#1e293b" stroke-width="1.5"/>`;

            const labelPos = polar(cx, cy, 36, deg / 2);

            return `
            <svg viewBox="0 0 220 220" class="w-full h-full">
                <path d="${sector}" fill="#fed7aa" stroke="#9a3412" stroke-width="2" stroke-linejoin="round"/>
                ${arcMark}
                <circle cx="${cx}" cy="${cy}" r="3" fill="#0f172a"/>
                <text x="${labelPos.x}" y="${labelPos.y}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" fill="#0f172a">${deg}°</text>
                <text x="${cx + r / 2}" y="${cy + 17}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">${rVal}cm</text>
            </svg>`;
        }

        // 第三大題 (1) SVG：正方形內挖去四個 1/4 圓，中央四角星形塗色 (附件三(1))
        function svgPart3StarInSquare(rVal) {
            const x0 = 46, y0 = 38, s = 128;
            const r = s / 2;
            const xm = x0 + r, ym = y0 + r;
            const x1 = x0 + s, y1 = y0 + s;

            // 中央四角星形：上中 -> 右中 -> 下中 -> 左中 -> 上中，四條凹向內的1/4圓弧
            const starPath = `
                M ${xm} ${y0}
                A ${r} ${r} 0 0 0 ${x1} ${ym}
                A ${r} ${r} 0 0 0 ${xm} ${y1}
                A ${r} ${r} 0 0 0 ${x0} ${ym}
                A ${r} ${r} 0 0 0 ${xm} ${y0}
                Z
            `;

            return `
            <svg viewBox="0 0 220 220" class="w-full h-full">
                <!-- 外框虛線正方形 -->
                <rect x="${x0}" y="${y0}" width="${s}" height="${s}" fill="#ffffff" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
                <!-- 中央星形塗色 -->
                <path d="${starPath}" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
                <!-- 四個頂點圓心與直角記號 -->
                <circle cx="${x0}" cy="${y0}" r="3" fill="#0f172a"/>
                <circle cx="${x1}" cy="${y0}" r="3" fill="#0f172a"/>
                <circle cx="${x0}" cy="${y1}" r="3" fill="#0f172a"/>
                <circle cx="${x1}" cy="${y1}" r="3" fill="#0f172a"/>
                <polyline points="${x0 + 10},${y0} ${x0 + 10},${y0 + 10} ${x0},${y0 + 10}" fill="none" stroke="#334155" stroke-width="1.2"/>
                <polyline points="${x1 - 10},${y0} ${x1 - 10},${y0 + 10} ${x1},${y0 + 10}" fill="none" stroke="#334155" stroke-width="1.2"/>
                <polyline points="${x0 + 10},${y1} ${x0 + 10},${y1 - 10} ${x0},${y1 - 10}" fill="none" stroke="#334155" stroke-width="1.2"/>
                <polyline points="${x1 - 10},${y1} ${x1 - 10},${y1 - 10} ${x1},${y1 - 10}" fill="none" stroke="#334155" stroke-width="1.2"/>
                <!-- 上下四段 rVal m 標示 -->
                <text x="${x0 + r / 2}" y="${y0 - 8}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">${rVal}m</text>
                <text x="${xm + r / 2}" y="${y0 - 8}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">${rVal}m</text>
                <text x="${x0 + r / 2}" y="${y1 + 17}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">${rVal}m</text>
                <text x="${xm + r / 2}" y="${y1 + 17}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">${rVal}m</text>
            </svg>`;
        }

        // 第三大題 (2) SVG：扇形環（外扇形 − 內扇形，附件三(2)）
        function svgPart3Annulus(deg, outerR, innerR) {
            const cx = 62, cy = 148;
            const R = 104;
            const r = Math.max(40, Math.round(R * (innerR / outerR)));
            const largeArc = deg > 180 ? 1 : 0;

            const pOuter0 = polar(cx, cy, R, 0);
            const pOuterD = polar(cx, cy, R, deg);
            const pInner0 = polar(cx, cy, r, 0);
            const pInnerD = polar(cx, cy, r, deg);

            const ringPath = `
                M ${pInner0.x} ${pInner0.y}
                L ${pOuter0.x} ${pOuter0.y}
                A ${R} ${R} 0 ${largeArc} 0 ${pOuterD.x} ${pOuterD.y}
                L ${pInnerD.x} ${pInnerD.y}
                A ${r} ${r} 0 ${largeArc} 1 ${pInner0.x} ${pInner0.y}
                Z
            `;

            const angleLabel = polar(cx, cy, 24, deg / 2);

            return `
            <svg viewBox="0 0 220 220" class="w-full h-full">
                <line x1="${cx}" y1="${cy}" x2="${pInner0.x}" y2="${pInner0.y}" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,2"/>
                <line x1="${cx}" y1="${cy}" x2="${pInnerD.x}" y2="${pInnerD.y}" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,2"/>
                <path d="${ringPath}" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="${cx}" cy="${cy}" r="3" fill="#0f172a"/>
                <text x="${angleLabel.x}" y="${angleLabel.y}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="bold" fill="#0f172a">${deg}°</text>
                <text x="${cx + r / 2}" y="${cy + 16}" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">${innerR}cm</text>
                <text x="${cx + R / 2}" y="${cy + 31}" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">外半徑 ${outerR}cm</text>
            </svg>`;
        }

        // 第三大題 (3) SVG：大半圓中挖除兩個小半圓（如附件三(3)拱橋形半圓組合）
        function svgPart3SemicircleCut(bigD) {
            const cx = 110, cy = 138, R = 76;
            const r = R / 2;

            // 大半圓上方拱形塗色，下方左右各挖去一個直徑為 bigD/2 的白色小半圓
            const bridgePath = `
                M ${cx - R} ${cy}
                A ${R} ${R} 0 0 1 ${cx + R} ${cy}
                A ${r} ${r} 0 0 0 ${cx} ${cy}
                A ${r} ${r} 0 0 0 ${cx - R} ${cy}
                Z
            `;

            return `
            <svg viewBox="0 0 220 220" class="w-full h-full">
                <line x1="${cx - R}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,2"/>
                <path d="${bridgePath}" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="${cx}" cy="${cy}" r="2.8" fill="#0f172a"/>
                <text x="${cx - r}" y="${cy + 17}" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">${bigD / 2}cm</text>
                <text x="${cx + r}" y="${cy + 17}" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">${bigD / 2}cm</text>
            </svg>`;
        }

        // 第三大題 (4) SVG：正方形牛舍右下角拴繩牛吃草 (嚴格對應附件三(4)插圖)
        function svgPart3CowBarn(barnSide, ropeLen) {
            const bx = 116, by = 122;
            const s = 74;
            const r = Math.min(68, Math.max(36, Math.round(s * (ropeLen / barnSide))));

            // 從正上方(bx, by - r)順時針繞 270° 到正左方(bx - r, by) 的 3/4 圓草地
            const grassSector = `
                M ${bx} ${by}
                L ${bx} ${by - r}
                A ${r} ${r} 0 1 1 ${bx - r} ${by}
                Z
            `;

            const cowPos = polar(bx, by, r, -20);

            return `
            <svg viewBox="0 0 220 220" class="w-full h-full">
                <!-- 牛能吃到的 3/4 圓草地 -->
                <path d="${grassSector}" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.6"/>
                <!-- 正方形牛舍 -->
                <rect x="${bx - s}" y="${by - s}" width="${s}" height="${s}" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.8"/>
                <!-- 四角直角記號 -->
                <polyline points="${bx - s + 8},${by - s} ${bx - s + 8},${by - s + 8} ${bx - s},${by - s + 8}" fill="none" stroke="#334155" stroke-width="1.1"/>
                <polyline points="${bx - 8},${by - s} ${bx - 8},${by - s + 8} ${bx},${by - s + 8}" fill="none" stroke="#334155" stroke-width="1.1"/>
                <polyline points="${bx - s + 8},${by} ${bx - s + 8},${by - 8} ${bx - s},${by - 8}" fill="none" stroke="#334155" stroke-width="1.1"/>
                <polyline points="${bx - 8},${by} ${bx - 8},${by - 8} ${bx},${by - 8}" fill="none" stroke="#334155" stroke-width="1.1"/>
                <text x="${bx - s / 2}" y="${by - s / 2 + 4}" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">牛舍</text>
                <!-- 牛舍邊長標示 -->
                <text x="${bx - s / 2}" y="${by - s - 8}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">${barnSide}m</text>
                <text x="${bx - s - 16}" y="${by - s / 2 + 4}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">${barnSide}m</text>
                <!-- 繩子與牛 -->
                <line x1="${bx}" y1="${by}" x2="${cowPos.x}" y2="${cowPos.y}" stroke="#0f172a" stroke-width="1.8"/>
                <circle cx="${bx}" cy="${by}" r="3.5" fill="#0f172a"/>
                <circle cx="${cowPos.x}" cy="${cowPos.y}" r="3.5" fill="#0f172a"/>
                <text x="${(bx + cowPos.x) / 2}" y="${(by + cowPos.y) / 2 + 15}" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">${ropeLen}m</text>
                <text x="${cowPos.x + 12}" y="${cowPos.y + 4}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">牛</text>
            </svg>`;
        }

        // =========================================================================
        // 3. 12 題隨機出題引擎（總分剛好 100 分）
        // 配分：第1~3題各8分(24分)、第4~7題各8分(32分)、第8~11題各9分(36分)、第12題8分(8分) => 共100分
        // =========================================================================
        function build12Questions() {
            const questions = [];

            // ---------------------------------------------------------------------
            // 一、看圖填填看（比值觀念，第 1~3 題，每題 8 分，共 24 分）
            // ---------------------------------------------------------------------
            const part1Angles = [
                { deg: 45, r: 16 },
                { deg: 60, r: 12 },
                { deg: 72, r: 15 },
                { deg: 90, r: 14 },
                { deg: 120, r: 18 },
                { deg: 135, r: 16 },
                { deg: 150, r: 12 },
                { deg: 216, r: 15 },
                { deg: 240, r: 18 },
                { deg: 270, r: 12 }
            ];
            const p1 = pick(part1Angles);
            const g1 = gcd(p1.deg, 360);
            const simpNum = p1.deg / g1;
            const simpDen = 360 / g1;
            const p1Svg = svgPart1Sector(p1.deg, p1.r);

            // 第 1 題 (8分)
            questions.push({
                id: 1,
                points: 8,
                type: 'frac',
                tag: '一、看圖填填看（8分）',
                prompt: `如圖，扇形圓心角為 ${p1.deg}°、半徑為 ${p1.r} cm，請問<strong>扇形圓心角對周角（360°）的比值</strong>是多少？（請填最簡分數）`,
                svg: p1Svg,
                num: simpNum,
                den: simpDen,
                correctDisplay: `${simpNum}/${simpDen}`
            });

            // 第 2 題 (8分)
            questions.push({
                id: 2,
                points: 8,
                type: 'frac',
                tag: '一、看圖填填看（8分）',
                prompt: `如圖，扇形圓心角為 ${p1.deg}°、半徑為 ${p1.r} cm，請問<strong>扇形弧長對圓周長的比值</strong>是多少？（請填最簡分數）`,
                svg: p1Svg,
                num: simpNum,
                den: simpDen,
                correctDisplay: `${simpNum}/${simpDen}`
            });

            // 第 3 題 (8分)
            questions.push({
                id: 3,
                points: 8,
                type: 'frac',
                tag: '一、看圖填填看（8分）',
                prompt: `如圖，扇形圓心角為 ${p1.deg}°、半徑為 ${p1.r} cm，請問<strong>扇形面積對圓面積的比值</strong>是多少？（請填最簡分數）`,
                svg: p1Svg,
                num: simpNum,
                den: simpDen,
                correctDisplay: `${simpNum}/${simpDen}`
            });

            // ---------------------------------------------------------------------
            // 二、看圖做做看（單一扇形弧長、周長、面積，第 4~7 題，每題 8 分，共 32 分）
            // ---------------------------------------------------------------------
            const p2aConfigs = [
                { deg: 150, num: 5, den: 12, r: 18 },
                { deg: 150, num: 5, den: 12, r: 24 },
                { deg: 120, num: 1, den: 3, r: 15 },
                { deg: 120, num: 1, den: 3, r: 21 },
                { deg: 135, num: 3, den: 8, r: 16 },
                { deg: 240, num: 2, den: 3, r: 15 },
                { deg: 210, num: 7, den: 12, r: 18 }
            ];
            const p2a = pick(p2aConfigs);
            const p2aArc = cleanNum((2 * p2a.r * p2a.num / p2a.den) * 3.14);
            const p2aPerim = cleanNum(p2aArc + 2 * p2a.r);
            const p2aSvg = svgPart2SingleSector(p2a.deg, p2a.r);

            // 第 4 題 (8分)：第二大題 (1) ① 扇形弧長
            questions.push({
                id: 4,
                points: 8,
                type: 'num',
                tag: '二、看圖做做看（8分）',
                prompt: `如圖，半徑為 ${p2a.r} cm、圓心角為 ${p2a.deg}° 的扇形，請問<strong>扇形弧長</strong>大約是多少 cm？`,
                svg: p2aSvg,
                answer: p2aArc,
                unit: 'cm',
                correctDisplay: `${p2aArc} cm`
            });

            // 第 5 題 (8分)：第二大題 (1) ② 扇形周長
            questions.push({
                id: 5,
                points: 8,
                type: 'num',
                tag: '二、看圖做做看（8分）',
                prompt: `承上題，半徑為 ${p2a.r} cm、圓心角為 ${p2a.deg}° 的扇形，請問<strong>扇形周長</strong>大約是多少 cm？`,
                svg: p2aSvg,
                answer: p2aPerim,
                unit: 'cm',
                correctDisplay: `${p2aPerim} cm`
            });

            const p2bConfigs = [
                { deg: 60, num: 1, den: 6, r: 12 },
                { deg: 60, num: 1, den: 6, r: 18 },
                { deg: 90, num: 1, den: 4, r: 12 },
                { deg: 90, num: 1, den: 4, r: 16 },
                { deg: 120, num: 1, den: 3, r: 12 },
                { deg: 72, num: 1, den: 5, r: 15 },
                { deg: 45, num: 1, den: 8, r: 16 }
            ];
            const p2b = pick(p2bConfigs);
            const p2bPerim = cleanNum((2 * p2b.r * p2b.num / p2b.den) * 3.14 + 2 * p2b.r);
            const p2bArea = cleanNum((p2b.r * p2b.r * p2b.num / p2b.den) * 3.14);
            const p2bSvg = svgPart2SingleSector(p2b.deg, p2b.r);

            // 第 6 題 (8分)：第二大題 (2) ① 扇形周長
            questions.push({
                id: 6,
                points: 8,
                type: 'num',
                tag: '二、看圖做做看（8分）',
                prompt: `如圖，半徑為 ${p2b.r} cm、圓心角為 ${p2b.deg}° 的扇形，請問<strong>扇形周長</strong>大約是多少 cm？`,
                svg: p2bSvg,
                answer: p2bPerim,
                unit: 'cm',
                correctDisplay: `${p2bPerim} cm`
            });

            // 第 7 題 (8分)：第二大題 (2) ② 扇形面積
            questions.push({
                id: 7,
                points: 8,
                type: 'num',
                tag: '二、看圖做做看（8分）',
                prompt: `承上題，半徑為 ${p2b.r} cm、圓心角為 ${p2b.deg}° 的扇形，請問<strong>扇形面積</strong>大約是多少 cm²？`,
                svg: p2bSvg,
                answer: p2bArea,
                unit: 'cm²',
                correctDisplay: `${p2bArea} cm²`
            });

            // ---------------------------------------------------------------------
            // 三、複合圖形與應用計算（第 8~11 題各 9 分，第 12 題 8 分，共 44 分）
            // ---------------------------------------------------------------------

            // 第 8 題 (9分)：第三大題 (1) 正方形挖去四個 1/4 圓星形塗色面積
            {
                const rVal = pick([3, 4, 5, 6, 8, 10]);
                const side = rVal * 2;
                // 塗色面積 = 正方形面積(side^2) - 4個1/4圓(rVal^2 * 3.14) = rVal^2 * (4 - 3.14) = rVal^2 * 0.86
                const ans = cleanNum(side * side - rVal * rVal * 3.14);

                questions.push({
                    id: 8,
                    points: 9,
                    type: 'num',
                    tag: '三、複合圖形計算（9分）',
                    prompt: `如圖，虛線正方形內以四個頂點為圓心各畫出半徑 ${rVal} m 的 <span class="fraction"><span class="num">1</span><span class="den">4</span></span> 圓，中央灰色塗色部分的<strong>面積</strong>大約是多少平方公尺（m²）？`,
                    svg: svgPart3StarInSquare(rVal),
                    answer: ans,
                    unit: 'm²',
                    correctDisplay: `${ans} m²`
                });
            }

            // 第 9 題 (9分)：第三大題 (2) ① 扇形環塗色部分的周長
            const annulusConfigs = [
                { deg: 45, num: 1, den: 8, outerR: 36, innerR: 20 },
                { deg: 45, num: 1, den: 8, outerR: 28, innerR: 12 },
                { deg: 60, num: 1, den: 6, outerR: 24, innerR: 12 },
                { deg: 90, num: 1, den: 4, outerR: 24, innerR: 16 },
                { deg: 90, num: 1, den: 4, outerR: 20, innerR: 12 },
                { deg: 72, num: 1, den: 5, outerR: 25, innerR: 15 }
            ];
            const ann = pick(annulusConfigs);
            const annOuterArc = cleanNum((2 * ann.outerR * ann.num / ann.den) * 3.14);
            const annInnerArc = cleanNum((2 * ann.innerR * ann.num / ann.den) * 3.14);
            const annPerim = cleanNum(annOuterArc + annInnerArc + 2 * (ann.outerR - ann.innerR));
            const annArea = cleanNum(((ann.outerR * ann.outerR - ann.innerR * ann.innerR) * ann.num / ann.den) * 3.14);
            const annSvg = svgPart3Annulus(ann.deg, ann.outerR, ann.innerR);

            questions.push({
                id: 9,
                points: 9,
                type: 'num',
                tag: '三、複合圖形計算（9分）',
                prompt: `如圖，圓心角為 ${ann.deg}° 的扇形環，外半徑為 ${ann.outerR} cm，內半徑為 ${ann.innerR} cm，塗色部分的<strong>周長</strong>大約是多少 cm？`,
                svg: annSvg,
                answer: annPerim,
                unit: 'cm',
                correctDisplay: `${annPerim} cm`
            });

            // 第 10 題 (9分)：第三大題 (2) ② 扇形環塗色部分的面積
            questions.push({
                id: 10,
                points: 9,
                type: 'num',
                tag: '三、複合圖形計算（9分）',
                prompt: `承上題，圓心角為 ${ann.deg}° 的扇形環，外半徑為 ${ann.outerR} cm，內半徑為 ${ann.innerR} cm，塗色部分的<strong>面積</strong>大約是多少 cm²？`,
                svg: annSvg,
                answer: annArea,
                unit: 'cm²',
                correctDisplay: `${annArea} cm²`
            });

            // 第 11 題 (9分)：第三大題 (3) 大半圓挖去兩個小半圓的塗色面積
            {
                const smallD = pick([8, 12, 16, 20, 24]);
                const bigD = smallD * 2;
                const bigR = smallD;
                const smallR = smallD / 2;
                // 塗色面積 = 大半圓(bigR^2 * 3.14 / 2) - 兩個小半圓(smallR^2 * 3.14)
                const ans = cleanNum(bigR * bigR * 3.14 * 0.5 - smallR * smallR * 3.14);

                questions.push({
                    id: 11,
                    points: 9,
                    type: 'num',
                    tag: '三、複合圖形計算（9分）',
                    prompt: `如圖，大半圓內挖去兩個直徑都是 ${smallD} cm 的小半圓，灰色塗色部分的<strong>面積</strong>大約是多少 cm²？`,
                    svg: svgPart3SemicircleCut(bigD),
                    answer: ans,
                    unit: 'cm²',
                    correctDisplay: `${ans} cm²`
                });
            }

            // 第 12 題 (8分)：第三大題 (4) 牛舍角落拴繩牛吃草面積 (rope <= barnSide，主 3/4 圓)
            {
                const cowConfigs = [
                    { barn: 16, rope: 8 },
                    { barn: 18, rope: 10 },
                    { barn: 20, rope: 12 },
                    { barn: 15, rope: 6 },
                    { barn: 24, rope: 16 }
                ];
                const cc = pick(cowConfigs);
                // 3/4 圓面積 = rope^2 * 3.14 * 3/4
                const ans = cleanNum(cc.rope * cc.rope * 3.14 * 0.75);

                questions.push({
                    id: 12,
                    points: 8,
                    type: 'num',
                    tag: '三、生活應用題（8分）',
                    prompt: `用一條長 ${cc.rope} 公尺的繩子把一頭牛拴在邊長 ${cc.barn} 公尺的正方形牛舍角落，如下圖（牛舍內部進不去），這頭牛能吃到的草地面積大約是幾平方公尺？`,
                    svg: svgPart3CowBarn(cc.barn, cc.rope),
                    answer: ans,
                    unit: '平方公尺',
                    correctDisplay: `${ans} 平方公尺`
                });
            }

            return questions;
        }

        // =========================================================================
        // 4. 測驗狀態與介面控制（12 題滿分 100 分）
        // =========================================================================
        let quizQuestions = [];
        let userAnswers = Array(12).fill(null); // frac題存 {num: '', den: ''}，num題存字串
        let currentIdx = 0;
        let isSubmitted = false;

        function startQuiz() {
            quizQuestions = build12Questions();
            userAnswers = quizQuestions.map(q => q.type === 'frac' ? { num: '', den: '' } : '');
            currentIdx = 0;
            isSubmitted = false;

            document.getElementById('scoreSummaryCard').classList.add('hidden');
            document.getElementById('submitConfirmBar').classList.add('hidden');
            document.getElementById('btnSubmitQuiz').classList.remove('hidden');

            renderNavDots();
            updateAnsweredCount();
            renderCurrentQuestion();
        }

        function restartQuiz() {
            clearPad();
            startQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function isQuestionAnswered(idx) {
            const q = quizQuestions[idx];
            const val = userAnswers[idx];
            if (q.type === 'frac') {
                return val && String(val.num).trim() !== '' && String(val.den).trim() !== '';
            }
            return val !== null && String(val).trim() !== '';
        }

        function isQuestionCorrect(idx) {
            const q = quizQuestions[idx];
            const val = userAnswers[idx];
            if (q.type === 'frac') {
                if (!val) return false;
                const n = parseInt(val.num, 10);
                const d = parseInt(val.den, 10);
                if (isNaN(n) || isNaN(d) || d === 0) return false;
                return n === q.num && d === q.den;
            }
            const parsed = parseFloat(val);
            return !isNaN(parsed) && Math.abs(parsed - q.answer) < 0.015;
        }

        function formatUserAnswer(idx) {
            const q = quizQuestions[idx];
            const val = userAnswers[idx];
            if (!isQuestionAnswered(idx)) return '未作答';
            if (q.type === 'frac') {
                return `${val.num}/${val.den}`;
            }
            return `${val} ${q.unit}`;
        }

        function updateAnsweredCount() {
            let count = 0;
            for (let i = 0; i < 12; i++) {
                if (isQuestionAnswered(i)) count++;
            }
            document.getElementById('answeredProgress').textContent = `已作答：${count} / 12 題`;
        }

        function renderNavDots() {
            const container = document.getElementById('questionNavDots');
            container.innerHTML = '';

            for (let i = 0; i < 12; i++) {
                const btn = document.createElement('button');
                btn.textContent = `${i + 1}`;
                let cls = "py-1.5 rounded-lg text-xs font-bold border transition ";

                if (isSubmitted) {
                    const correct = isQuestionCorrect(i);
                    if (correct) {
                        cls += (i === currentIdx)
                            ? "bg-emerald-600 text-white border-emerald-700 ring-2 ring-emerald-300"
                            : "bg-emerald-100 text-emerald-800 border-emerald-300";
                    } else {
                        cls += (i === currentIdx)
                            ? "bg-rose-600 text-white border-rose-700 ring-2 ring-rose-300"
                            : "bg-rose-100 text-rose-800 border-rose-300";
                    }
                } else {
                    if (i === currentIdx) {
                        cls += "bg-indigo-600 text-white border-indigo-700 shadow-sm";
                    } else if (isQuestionAnswered(i)) {
                        cls += "bg-indigo-50 text-indigo-800 border-indigo-300";
                    } else {
                        cls += "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100";
                    }
                }

                btn.className = cls;
                btn.onclick = () => {
                    currentIdx = i;
                    renderCurrentQuestion();
                    renderNavDots();
                };
                container.appendChild(btn);
            }
        }

        function renderCurrentQuestion() {
            const q = quizQuestions[currentIdx];
            document.getElementById('qNumberBadge').textContent = `第 ${currentIdx + 1} / 12 題`;
            document.getElementById('qPointsBadge').textContent = `本題 ${q.points} 分`;
            document.getElementById('qTypeTag').textContent = q.tag;
            document.getElementById('questionPrompt').innerHTML = q.prompt;
            document.getElementById('svgContainer').innerHTML = q.svg;

            const fracBox = document.getElementById('fractionInputContainer');
            const numBox = document.getElementById('numericInputContainer');
            const postBanner = document.getElementById('postSubmitResultBanner');

            if (q.type === 'frac') {
                fracBox.classList.remove('hidden');
                numBox.classList.add('hidden');
                const numEl = document.getElementById('fracNumInput');
                const denEl = document.getElementById('fracDenInput');
                numEl.value = userAnswers[currentIdx].num || '';
                denEl.value = userAnswers[currentIdx].den || '';
                numEl.disabled = isSubmitted;
                denEl.disabled = isSubmitted;
            } else {
                fracBox.classList.add('hidden');
                numBox.classList.remove('hidden');
                document.getElementById('unitText').textContent = q.unit;
                const inputEl = document.getElementById('numericAnswerInput');
                inputEl.value = userAnswers[currentIdx] || '';
                inputEl.disabled = isSubmitted;
            }

            if (isSubmitted) {
                postBanner.classList.remove('hidden');
                const correct = isQuestionCorrect(currentIdx);
                const userDisp = formatUserAnswer(currentIdx);

                if (correct) {
                    postBanner.className = "rounded-xl p-3.5 text-sm font-bold border bg-emerald-50 border-emerald-300 text-emerald-800";
                    postBanner.innerHTML = `⭕ 答對（+${q.points} 分）｜正確答案：${q.correctDisplay}`;
                } else {
                    postBanner.className = "rounded-xl p-3.5 text-sm font-bold border bg-rose-50 border-rose-300 text-rose-800";
                    postBanner.innerHTML = `❌ 答錯（0 分）｜你的答案：${userDisp} ｜ 正確答案：${q.correctDisplay}`;
                }
            } else {
                postBanner.classList.add('hidden');
            }

            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            btnPrev.disabled = currentIdx === 0;
            btnPrev.classList.toggle('opacity-40', currentIdx === 0);

            if (currentIdx === 11) {
                btnNext.textContent = isSubmitted ? '已到最後一題' : '完成（準備交卷）';
                btnNext.disabled = isSubmitted;
                btnNext.classList.toggle('opacity-40', isSubmitted);
            } else {
                btnNext.textContent = '下一題 →';
                btnNext.disabled = false;
                btnNext.classList.remove('opacity-40');
            }
        }

        function handleFractionInput() {
            if (isSubmitted) return;
            userAnswers[currentIdx] = {
                num: document.getElementById('fracNumInput').value.trim(),
                den: document.getElementById('fracDenInput').value.trim()
            };
            updateAnsweredCount();
            renderNavDots();
        }

        function handleNumericInput(val) {
            if (isSubmitted) return;
            userAnswers[currentIdx] = val.trim();
            updateAnsweredCount();
            renderNavDots();
        }

        function goPrevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                renderCurrentQuestion();
                renderNavDots();
            }
        }

        function goNextQuestion() {
            if (currentIdx < 11) {
                currentIdx++;
                renderCurrentQuestion();
                renderNavDots();
            } else if (!isSubmitted) {
                openSubmitConfirm();
            }
        }

        function openSubmitConfirm() {
            let unanswered = 0;
            for (let i = 0; i < 12; i++) {
                if (!isQuestionAnswered(i)) unanswered++;
            }
            const confirmText = unanswered > 0
                ? `你還有 ${unanswered} 題尚未作答，確定要現在交卷嗎？`
                : `12 題都已經作答完成，確定要交卷看成績嗎？`;
            document.getElementById('submitConfirmText').textContent = confirmText;
            document.getElementById('submitConfirmBar').classList.remove('hidden');
        }

        function closeSubmitConfirm() {
            document.getElementById('submitConfirmBar').classList.add('hidden');
        }

        function finalizeQuiz() {
            isSubmitted = true;
            document.getElementById('submitConfirmBar').classList.add('hidden');
            document.getElementById('btnSubmitQuiz').classList.add('hidden');

            let totalScore = 0;
            let correctCount = 0;
            const tbody = document.getElementById('scoreTableBody');
            tbody.innerHTML = '';

            for (let i = 0; i < 12; i++) {
                const q = quizQuestions[i];
                const correct = isQuestionCorrect(i);
                const earned = correct ? q.points : 0;
                if (correct) {
                    correctCount++;
                    totalScore += earned;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 cursor-pointer";
                tr.onclick = () => {
                    currentIdx = i;
                    renderCurrentQuestion();
                    renderNavDots();
                    document.getElementById('questionMainCard').scrollIntoView({ behavior: 'smooth' });
                };

                tr.innerHTML = `
                    <td class="py-2.5 px-3 text-center font-bold text-slate-700">第 ${i + 1} 題</td>
                    <td class="py-2.5 px-3 text-center text-slate-500">${q.points} 分</td>
                    <td class="py-2.5 px-3 text-left text-slate-600">${q.tag}</td>
                    <td class="py-2.5 px-3 text-center font-bold ${correct ? 'text-emerald-700' : 'text-rose-600'}">${formatUserAnswer(i)}</td>
                    <td class="py-2.5 px-3 text-center font-bold text-slate-800">${q.correctDisplay}</td>
                    <td class="py-2.5 px-3 text-center font-bold">${correct ? `<span class="text-emerald-600">+${earned} 分</span>` : '<span class="text-rose-600">0 分</span>'}</td>
                `;
                tbody.appendChild(tr);
            }

            document.getElementById('totalScoreText').textContent = totalScore;
            document.getElementById('scoreSummarySub').textContent = `答對 ${correctCount} 題 / 共 12 題（點擊下方列表可切換檢視各題作答結果）`;
            document.getElementById('scoreSummaryCard').classList.remove('hidden');

            renderNavDots();
            renderCurrentQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // =========================================================================
        // 5. 手寫空白計算草稿紙
        // =========================================================================
        let canvas, ctx;
        let drawing = false;
        let strokeColor = '#1e293b';
        let strokeWidth = 2.5;

        function initPad() {
            canvas = document.getElementById('scratchpadCanvas');
            ctx = canvas.getContext('2d');
            resizePad();
            window.addEventListener('resize', resizePad);

            canvas.addEventListener('mousedown', (e) => {
                drawing = true;
                const r = canvas.getBoundingClientRect();
                ctx.beginPath();
                ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
            });
            canvas.addEventListener('mousemove', (e) => {
                if (!drawing) return;
                const r = canvas.getBoundingClientRect();
                ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.stroke();
            });
            canvas.addEventListener('mouseup', () => drawing = false);
            canvas.addEventListener('mouseout', () => drawing = false);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                drawing = true;
                const t = e.touches[0];
                const r = canvas.getBoundingClientRect();
                ctx.beginPath();
                ctx.moveTo(t.clientX - r.left, t.clientY - r.top);
            }, { passive: false });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!drawing) return;
                const t = e.touches[0];
                const r = canvas.getBoundingClientRect();
                ctx.lineTo(t.clientX - r.left, t.clientY - r.top);
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.stroke();
            }, { passive: false });
            canvas.addEventListener('touchend', () => drawing = false);
        }

        function resizePad() {
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            if (rect.width > 0) {
                canvas.width = rect.width - 24;
                canvas.height = 380;
                clearPad();
            }
        }

        function setPen(color, width) {
            strokeColor = color;
            strokeWidth = width;
        }

        function setEraser() {
            strokeColor = '#fffdf7';
            strokeWidth = 20;
        }

        function clearPad() {
            if (!ctx) return;
            ctx.fillStyle = '#fffdf7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        window.onload = function () {
            initPad();
            startQuiz();
        };
    </script>
</body>
</html>
